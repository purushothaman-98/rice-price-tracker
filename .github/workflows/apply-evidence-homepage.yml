name: Apply evidence archive homepage update

on:
  push:
    branches:
      - expand/evidence-2019-2026
    paths:
      - .github/workflows/apply-evidence-homepage.yml

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expand/evidence-2019-2026
          fetch-depth: 0

      - name: Update homepage evidence range and archive link
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          text = path.read_text()

          replacements = {
              '            <p className="mt-2 text-3xl font-extrabold">2024–2026</p>':
              '            <p className="mt-2 text-3xl font-extrabold">2019–2026</p>',
              '              Official policy notes, procurement statements and source-labelled market reporting.':
              '              Eight years of official releases, procurement records, crop shocks and source-labelled market reporting.',
              '          eyebrow="Recent evidence desk · 2024–2026"':
              '          eyebrow="Evidence desk · 2019–2026"',
              '          intro="Official policy documents tell us what changed legally. Government statements report programme progress. News reports provide market quotations and actor claims. The cards below preserve those differences."':
              '          intro="The homepage presents the major evidence phases. Open the full archive for year-by-year official releases, reported government statements, market quotations, interpretation, limitations and source links."',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected homepage text not found: {old}")
              text = text.replace(old, new, 1)

          marker = '''        <div className="mt-5 flex flex-wrap gap-2 text-xs">
          <span className="border border-paddy bg-paddy/10 px-2 py-1 font-bold text-paddy">Official policy</span>
          <span className="border border-turmeric bg-turmeric/15 px-2 py-1 font-bold">Official statement reported</span>
          <span className="border border-maroon bg-maroon/5 px-2 py-1 font-bold text-maroon">Market reporting</span>
        </div>'''

          replacement = marker + '''

        <Link
          to="/evidence"
          className="mt-4 inline-flex min-h-11 items-center gap-2 border border-maroon px-3 text-sm font-bold text-maroon hover:bg-maroon hover:text-maroon-foreground"
        >
          Open the full 2019–2026 evidence archive <ArrowRight className="size-4" aria-hidden="true" />
        </Link>'''

          if marker not in text:
              raise SystemExit("Evidence legend marker not found")
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Link homepage to 2019–2026 evidence archive"
          git push origin HEAD:expand/evidence-2019-2026
